<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="crestGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#6B5003" />
    </linearGradient>
    <linearGradient id="crestGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4E30" />
      <stop offset="50%" stop-color="#0B3B24" />
      <stop offset="100%" stop-color="#051D11" />
    </linearGradient>
    <linearGradient id="basketballOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#CC4400" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M 200,10 L 375,65 C 375,270 290,405 200,470 C 110,405 25,270 25,65 Z" 
        fill="url(#crestGoldGrad)" filter="url(#shadow)" stroke="#4A3B08" stroke-width="2"/>

  <!-- Inner Shield (Deep Forest Green) -->
  <path d="M 200,24 L 357,75 C 357,258 280,385 200,448 C 120,385 43,258 43,75 Z" 
        fill="url(#crestGreenGrad)" stroke="#E5C158" stroke-width="3"/>

  <!-- Inner Crest Gold Border Accent -->
  <path d="M 200,34 L 345,82 C 345,248 272,370 200,430 C 128,370 55,248 55,82 Z" 
        fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Top Banner: DISTRICT 2 LEAGUE -->
  <path d="M 70,82 Q 200,60 330,82 L 320,118 Q 200,98 80,118 Z" fill="#06180E" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="200" y="105" text-anchor="middle" fill="#D4AF37" font-family="'Oswald', 'Impact', sans-serif" font-weight="900" font-size="20" letter-spacing="3">DISTRICT 2 LEAGUE</text>

  <!-- Central Basketball with Seams -->
  <g transform="translate(200, 225)">
    <circle cx="0" cy="0" r="72" fill="url(#basketballOrangeGrad)" stroke="#D4AF37" stroke-width="4"/>
    <!-- Basketball Grooves / Ribs -->
    <path d="M -72,0 L 72,0" stroke="#06180E" stroke-width="4"/>
    <path d="M 0,-72 L 0,72" stroke="#06180E" stroke-width="4"/>
    <path d="M -50,-50 C -15,-20 -15,20 -50,50" fill="none" stroke="#06180E" stroke-width="4"/>
    <path d="M 50,-50 C 15,-20 15,20 50,50" fill="none" stroke="#06180E" stroke-width="4"/>
  </g>

  <!-- Center Gold Monogram "D2L" -->
  <g transform="translate(200, 238)">
    <!-- Shadow -->
    <text x="0" y="6" text-anchor="middle" fill="#000000" font-family="'Impact', 'Oswald', sans-serif" font-weight="900" font-size="74" letter-spacing="2">D2L</text>
    <!-- Text Fill with Gold gradient -->
    <text x="0" y="0" text-anchor="middle" fill="url(#crestGoldGrad)" stroke="#06180E" stroke-width="3" font-family="'Impact', 'Oswald', sans-serif" font-weight="900" font-size="74" letter-spacing="2">D2L</text>
  </g>

  <!-- Stars Accent on Sides -->
  <polygon points="100,160 106,174 122,174 109,184 114,198 100,188 86,198 91,184 78,174 94,174" fill="#D4AF37"/>
  <polygon points="300,160 306,174 322,174 309,184 314,198 300,188 286,198 291,184 278,174 294,174" fill="#D4AF37"/>

  <!-- Lower Ribbon: SEASON X -->
  <g transform="translate(200, 335)">
    <path d="M -120,-16 L 120,-16 L 105,16 L -105,16 Z" fill="#FF6B00" stroke="#D4AF37" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="800" font-size="20" letter-spacing="4">SEASON X</text>
  </g>

  <!-- Bottom Tag: EST. 2014 • AYALA ALABANG -->
  <text x="200" y="380" text-anchor="middle" fill="#D4AF37" font-family="'Oswald', sans-serif" font-weight="700" font-size="15" letter-spacing="2">EST. 2014</text>
  <text x="200" y="405" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">AYALA ALABANG</text>
</svg>
